{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:1rem auto;">
  <h2>Forgot Password</h2>
  <p style="color:var(--text-dim);font-size:0.88rem;margin-bottom:1rem;">
    Submit your email. The admin will generate a temporary password and send it to you.
    After logging in, change it under Password.
  </p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required>
    <button class="btn" type="submit">Request reset</button>
  </form>
</div>
{% endblock %}
