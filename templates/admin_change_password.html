{% extends "admin_base.html" %}
{% block title %}Admin Password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:1rem auto;">
  <h2>Change Admin Password</h2>
  {% if forced %}<p class="flash warning"><strong>Security notice:</strong> this account still uses the default password. Choose a new password to continue.</p>{% endif %}
  <form method="post">
    <label>New password (min 6)</label>
    <input type="password" name="new_password" required minlength="6">
    <button class="btn" type="submit">Update</button>
  </form>
</div>
{% endblock %}
